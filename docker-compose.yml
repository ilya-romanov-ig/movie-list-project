version: "3.9"

services:
  # ----------------------- FRONTEND (DEV MODE) -----------------------
  frontend:
    build: ./front
    container_name: vue-frontend
    ports:
      - "8080:5173"
    environment:
      VITE_API_URL: http://localhost:8001
      VITE_IMAGES_URL: http://localhost:8001
    volumes:
      - ./front:/app
      - /app/node_modules
    stdin_open: true
    tty: true
    command: npm run dev -- --host 0.0.0.0
    
  # ----------------------- BACKEND -----------------------
  backend:
    build: ./back
    container_name: fastapi-backend
    restart: always
    ports:
      - "8001:8000"
    environment:
      DATABASE_URL: postgresql+asyncpg://postgres:postgres@db:5432/appdb
      JWT_SECRET: "supersecretkey123"
      JWT_ALG: "HS256"
      POSTERS_PATH: /app/posters
      POSTERS_BASE_URL: http://localhost:8001/posters
      ML_URL: http://movie-recommender:8000
    volumes:
      - ./back/posters:/app/posters:ro
      - ./back:/app  # для разработки бэкенда
    depends_on:
      db:
        condition: service_healthy  # ждем готовности БД
      movie-recommender:
        condition: service_healthy
    # Добавим healthcheck для бэкенда
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/health"]
      interval: 30s
      timeout: 10s
      retries: 3

  backend-test:
    build: ./back
    container_name: fastapi-backend-test
    command: ["pytest", "tests/", "-v"]
    environment:
      DATABASE_URL: postgresql+asyncpg://postgres:postgres@db:5432/appdb
      JWT_SECRET: "test_secret"
      ML_URL: http://mock-ml:8000
    depends_on:
      mock-ml:
        condition: service_started
  
  # Мок для ML сервиса в тестах
  mock-ml:
    image: mockserver/mockserver:latest
    container_name: mock-ml-service
    ports:
      - "8003:1080"
    command: >
      -serverPort 1080
      -logLevel INFO

  # ----------------------- ML SERVICE -----------------------
  movie-recommender:
    build: ./ml
    container_name: movie-recommender-api
    ports:
      - "8002:8000"
    volumes:
      - ./ml/data:/app/data:ro
      - ./ml/logs:/app/logs
    env_file:
      - ./ml/.env
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s

  # ----------------------- POSTGRES -----------------------
  db:
    image: postgres:18
    container_name: postgres-db
    restart: always
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: appdb
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql
      - ./back/db_init:/docker-entrypoint-initdb.d
    # Добавим healthcheck для БД
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 10s
      timeout: 5s
      retries: 5

volumes:
  pgdata: