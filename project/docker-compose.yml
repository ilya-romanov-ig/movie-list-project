version: "3.9"

networks:
  app-network:
    driver: bridge
    ipam:
      config:
        - subnet: 172.20.0.0/16

services:
  # ----------------------- FRONTEND (VITE DEV SERVER) -----------------------
  frontend:
    build: ./front
    container_name: frontend
    ports:
      - "5173:5173"  # Изменил с 8080:5173 на 5173:5173 для consistency
    environment:
      VITE_API_URL: http://localhost:8001
      VITE_IMAGES_URL: http://localhost:8001
      VITE_ELECTRON_MODE: "true"  
    volumes:
      - ./front:/app
      - /app/node_modules
    stdin_open: true
    tty: true
    command: npm run dev -- --host 0.0.0.0 --port 5173
    networks:
      - app-network
    
  # ----------------------- BACKEND -----------------------
  backend:
    build: ./back
    container_name: backend
    restart: always
    ports:
      - "8001:8000"
    environment:
      DATABASE_URL: postgresql+asyncpg://postgres:postgres@db:5432/appdb
      JWT_SECRET: "supersecretkey123"
      JWT_ALG: "HS256"
      POSTERS_PATH: /app/posters
      POSTERS_BASE_URL: http://localhost:8001/posters
      ML_URL: http://movie-recommender:8000
      CORS_ORIGINS: "http://localhost:5173,http://localhost:3000,file://"  # Для Electron
    volumes:
      - ./back/posters:/app/posters:ro
      - ./back:/app
    depends_on:
      db:
        condition: service_healthy
      movie-recommender:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/health"]
      interval: 10s
      timeout: 5s
      retries: 3
    networks:
      - app-network

  # ----------------------- BACKEND TESTS -----------------------
  backend-test:
    build:
      context: ./back
      dockerfile: Dockerfile.test  
    command: ["pytest", "tests/", "-v", "--tb=short"]
    environment:
      DATABASE_URL: postgresql+asyncpg://postgres:postgres@db:5432/appdb
      ML_SERVICE_URL: http://ml-mock:8001
      JWT_SECRET: "test_secret_key_for_testing_only"
      TESTING: "true"
      PYTHONPATH: "/app"
    depends_on:
      db:
        condition: service_healthy
      ml-mock:
        condition: service_started

  # ----------------------- ML MOCK FOR TESTS -----------------------
  ml-mock:
    build:
      context: ./ml-mock  # Создадим простой мок-сервер
      dockerfile: Dockerfile
    container_name: ml-mock
    ports:
      - "8003:8000"  # Используем другой порт
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8003/health"]
      interval: 10s
      timeout: 5s
      retries: 3

  # ----------------------- ML SERVICE -----------------------
  movie-recommender:
    build: ./ml
    container_name: ml
    ports:
      - "8002:8000"
    volumes:
      - ./ml/data:/app/data:ro
      - ./ml/logs:/app/logs
    env_file:
      - ./ml/.env
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8002/health"]
      interval: 10s
      timeout: 5s
      retries: 3

  # ----------------------- POSTGRES -----------------------
  db:
    image: postgres:18
    container_name: postgres-db
    restart: always
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: appdb
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql
      - ./back/db_init:/docker-entrypoint-initdb.d
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 10s
      timeout: 5s
      retries: 3

volumes:
  pgdata:
  test-pgdata: