services:
  movie-recommender:
    build: .
    container_name: movie-recommender-api
    ports:
      - "8000:8000"
    volumes:
      # Монтируем данные (только для чтения)
      - ./data:/app/data:ro
      # Монтируем логи
      - ./logs:/app/logs
      # Для разработки: монтируем код
      # - ./app:/app:ro
    environment:
      # Переменные окружения из .env файла
      - ENVIRONMENT=${ENVIRONMENT:-production}
      - CACHE_TTL=${CACHE_TTL:-300}
      - MODEL_UPDATE_INTERVAL=${MODEL_UPDATE_INTERVAL:-3600}
      - RATINGS_PATH=${RATINGS_PATH:-data/ratings.csv}
      - FAV_FILMS_PATH=${FAV_FILMS_PATH:-data/favourite_films.csv}
      - FAV_ACTORS_PATH=${FAV_ACTORS_PATH:-data/favourite_actors.csv}
      - FILM_ACTOR_PATH=${FILM_ACTOR_PATH:-data/film_actor.csv}
      - LOG_LEVEL=${LOG_LEVEL:-INFO}
    env_file:
      - .env
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"

